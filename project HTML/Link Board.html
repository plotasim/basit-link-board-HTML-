<!doctype html> <html> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Link Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f3f5fb;
    --surface: rgba(255, 255, 255, 0.78);
    --surface-strong: #ffffff;
    --ink: #171a22;
    --muted: #5f6778;
    --rule: #dfe4ee;
    --accent: #5b4ef5;
    --accent-strong: #4338ca;
    --accent-ink: #ffffff;
    --glow: rgba(91, 78, 245, 0.16);
    --shadow: 0 24px 70px rgba(35, 43, 69, 0.12);
    --display: "Bricolage Grotesque", "Segoe UI", Arial, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1220;
      --surface: rgba(21, 27, 40, 0.8);
      --surface-strong: #1a2332;
      --ink: #edf2ff;
      --muted: #9aa5bd;
      --rule: #2d3a52;
      --accent: #8d8bff;
      --accent-strong: #a09eff;
      --accent-ink: #0e1220;
      --glow: rgba(141, 139, 255, 0.18);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }

  [data-theme="dark"] {
    --bg: #0e1220;
    --surface: rgba(21, 27, 40, 0.8);
    --surface-strong: #1a2332;
    --ink: #edf2ff;
    --muted: #9aa5bd;
    --rule: #2d3a52;
    --accent: #8d8bff;
    --accent-strong: #a09eff;
    --accent-ink: #0e1220;
    --glow: rgba(141, 139, 255, 0.18);
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(circle at 85% 10%, var(--glow), transparent 30%),
      linear-gradient(180deg, #f8f8ff 0%, var(--bg) 38%);
    color: var(--ink);
    font: 400 16px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }

  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .wrap {
    width: min(100%, 640px);
    margin: 0 auto;
    padding: 24px 16px 72px;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font: 700 11px/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .brand::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--glow);
  }

  nav { display: flex; gap: 6px; }

  .view {
    background: var(--surface);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 28px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    overflow: hidden;
  }

  .profile {
    padding: 26px;
    background:
      linear-gradient(135deg, var(--glow), transparent 42%),
      var(--surface-strong);
  }

  .identity {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .avatar {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    flex: 0 0 auto;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: var(--accent-ink);
    font: 800 28px/1 var(--display);
    letter-spacing: -0.04em;
    box-shadow: 0 12px 30px var(--glow);
  }

  h1 {
    margin: 0;
    font: 800 clamp(32px, 6vw, 52px)/0.96 var(--display);
    letter-spacing: -0.045em;
    overflow-wrap: anywhere;
  }

  .tagline {
    margin: 7px 0 0;
    color: var(--muted);
    font: 500 12px/1.5 var(--mono);
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }

  .bio {
    margin: 24px 0 0;
    max-width: 52ch;
    color: var(--muted);
    font-size: 17px;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .links li + li { border-top: 1px solid var(--rule); }

  .link-card {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 16px 22px;
    color: inherit;
    text-decoration: none;
    transition: transform 160ms ease, background 160ms ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    background: var(--glow);
    transform: translateX(3px);
  }

  .tag {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--surface-strong);
    color: var(--accent);
    font: 700 11px var(--mono);
    letter-spacing: 0.06em;
  }

  .txt { min-width: 0; }
  .txt strong {
    display: block;
    font: 700 19px/1.25 var(--display);
    letter-spacing: -0.015em;
  }
  .txt em {
    display: block;
    color: var(--muted);
    font: 400 12px/1.5 var(--mono);
    font-style: normal;
    overflow-wrap: anywhere;
  }

  .go {
    color: var(--accent);
    font: 700 20px var(--mono);
    transition: transform 160ms ease;
  }

  .link-card:hover .go,
  .link-card:focus-visible .go { transform: translate(3px, -3px); }

  .form-wrap { padding: 28px; }
  .section-heading { margin: 0 0 24px; font: 800 28px/1.05 var(--display); letter-spacing: -0.04em; }
  .section-copy { margin: -14px 0 24px; color: var(--muted); }

  form { display: grid; gap: 18px; }
  .field { display: grid; gap: 8px; }
  .field label {
    color: var(--muted);
    font: 700 11px var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

  input, select, button[type="submit"] {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: var(--surface-strong);
    font-size: 16px;
  }

  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }

  button[type="submit"] {
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: var(--accent-ink);
    font: 700 15px var(--body);
    cursor: pointer;
    transition: transform 160ms ease, filter 160ms ease;
  }

  button[type="submit"]:hover { transform: translateY(-1px); filter: brightness(1.05); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 480px) {
    .wrap { padding-inline: 12px; }
    .top { margin-bottom: 18px; }
    .profile, .form-wrap { padding: 20px; }
    .identity { align-items: flex-start; }
    .pair { grid-template-columns: 1fr; }
    .link-card { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; padding-inline: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .link-card, .go, button[type="submit"] { transition: none; }
  }
</style>
</head>

<body>

<div class="wrap">

<div class="top"> <span class="brand">/links</span> </div>

<main>
  <section id="view-links" class="view">
    <header class="profile">
      <div class="identity">
        <div class="avatar" aria-hidden="true">YN</div>
        <div>
          <h1>Sami socials</h1>
          <p class="tagline">hello, welcome to my online world</p>
        </div>
      </div>
      <p class="bio">Discover my latest posts, projects, and updates across the platforms below.</p>
    </header>

    <ul class="links">
      <li><a class="link-card" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><span class="tag">IG</span><span class="txt"><strong>Instagram</strong><em>@yourhandle</em></span><span class="go" aria-hidden="true">↗</span></a></li>
      <li><a class="link-card" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer"><span class="tag">TT</span><span class="txt"><strong>TikTok</strong><em>@yourhandle</em></span><span class="go" aria-hidden="true">↗</span></a></li>
      <li><a class="link-card" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"><span class="tag">YT</span><span class="txt"><strong>YouTube</strong><em>@yourhandle</em></span><span class="go" aria-hidden="true">↗</span></a></li>
      <li><a class="link-card" href="https://x.com/" target="_blank" rel="noopener noreferrer"><span class="tag">X</span><span class="txt"><strong>X</strong><em>@yourhandle</em></span><span class="go" aria-hidden="true">↗</span></a></li>
      <li><a class="link-card" href="https://github.com/plotasim" target="_blank" rel="noopener noreferrer"><span class="tag">GH</span><span class="txt"><strong>GitHub</strong><em>plotasim</em></span><span class="go" aria-hidden="true">↗</span></a></li>
    </ul>
  </section>

</main>
</div>

</body>
</html>
